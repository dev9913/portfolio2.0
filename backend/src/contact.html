<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* General styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f1f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            padding: 40px 50px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            transition: all 0.3s ease-in-out;
        }

        .container h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            box-sizing: border-box;
            transition: border 0.3s ease-in-out;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #7e57c2;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 150px;
        }

        .btn-submit {
            padding: 14px 30px;
            background-color: #7e57c2;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
        }

        .btn-submit:hover {
            background-color: #5e35b1;
            transform: translateY(-2px);
        }

        .btn-submit:active {
            background-color: #512da8;
            transform: translateY(2px);
        }

        .message {
            font-size: 1.1rem;
            margin-top: 20px;
            display: block;
        }

        .message.success {
            color: #4caf50;
        }

        .message.error {
            color: #f44336;
        }

        .thank-you-message {
            font-size: 1.4rem;
            color: #333;
            margin-top: 30px;
        }

        /* Animation */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container fade-in">
        <h2>Contact Us</h2>
        <form id="contactForm" action="/contact" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" name="name" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea name="message" id="message" placeholder="Write your message" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
        <div id="message" class="message"></div>
        <div id="thankYouMessage" class="thank-you-message" style="display: none;">
            Thank you for contacting us! We will get back to you shortly. Redirecting in: <span id="countdown">5</span> seconds.
        </div>
    </div>

     <script>
        const form = document.getElementById('contactForm');
        const messageDiv = document.getElementById('message');
        const thankYouMessageDiv = document.getElementById('thankYouMessage');
        const countdownElement = document.getElementById('countdown');
        const container = document.querySelector('.container');
        let countdown = 5;  // Start countdown at 5 seconds

        form.addEventListener('submit', function (e) {
            e.preventDefault();  // Prevent form default submission

            const formData = new FormData(form);  // Create FormData object with form data

            // Send form data to server
            fetch('/contact', {
                method: 'POST',
                body: formData  // Send FormData directly
            })
                .then(response => response.json())
                .then(data => {
                    // Display success or error message
                    if (data.status === 'success') {
                        messageDiv.innerHTML = `<p class="success">${data.message}</p>`;
                        form.style.display = 'none'; // Hide the form
                        thankYouMessageDiv.style.display = 'block'; // Show the thank you message
                          // Redirect to homepage or another URL
                        
                        // Countdown logic for redirect
                        const countdownInterval = setInterval(function() {
                            countdown--;
                            countdownElement.textContent = countdown;
                            if (countdown <= 0) {
                                clearInterval(countdownInterval);
                                window.location.href = '/contact';  // Redirect to homepage or another URL
                            }
                        }, 1000);  // Update every second
                    } else {
                        messageDiv.innerHTML = `<p class="error">${data.errors.join(', ')}</p>`;
                    }
                })
                .catch(err => {
                    messageDiv.innerHTML = `<p class="error">An error occurred. Please try again.</p>`;
                });
        });
    </script>
