<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
    --accent: #d4a373;        /* clay / warm tan */
    --accent-soft: #b7c4a0;   /* sage green */
    --bg-card: #242320;       /* dark warm taupe */
    --bg-soft: #1f1e1b;
    --text-main: #e6e2d3;     /* soft sandstone */
    --text-muted: #bdb8aa;
    --border-soft: #3a3935;
}
    body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-soft);
    color: var(--text-main);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background-color: var(--bg-card);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
    width: 100%;
    max-width: 650px;
    padding: 40px 50px;
    border-radius: 14px;
    text-align: center;
    position: relative;
    transition: all 0.3s ease-in-out;
}

/* Headings */
.container h2 {
    font-size: 2rem;
    margin-bottom: 20px;
    color: var(--accent);
    font-weight: 600;
}

/* Form */
.form-group {
    margin-bottom: 25px;
    text-align: left;
}

.form-group label {
    display: block;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
}

/* Inputs */
.form-group input,
.form-group textarea {
    width: 100%;
    padding: 15px;
    font-size: 1.05rem;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    background-color: #2b2a26;
    color: var(--text-main);
    box-sizing: border-box;
    transition: all 0.3s ease-in-out;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #8f8a7b;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: var(--accent);
    outline: none;
    box-shadow: 0 0 0 2px rgba(212, 163, 115, 0.25);
}

.form-group textarea {
    resize: vertical;
    height: 150px;
}

/* Button */
.btn-submit {
    padding: 14px 32px;
    background-color: var(--accent);
    color: #1f1e1b;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(212, 163, 115, 0.35);
    transition: all 0.3s ease-in-out;
}

.btn-submit:hover {
    background-color: var(--accent-soft);
    transform: translateY(-2px);
}

.btn-submit:active {
    transform: translateY(1px);
}

/* Messages */
.message {
    font-size: 1.05rem;
    margin-top: 20px;
}

.message.success {
    color: var(--accent-soft);
}

.message.error {
    color: #e07a5f;
}

.thank-you-message {
    font-size: 1.4rem;
    color: var(--accent);
    margin-top: 30px;
}

/* Animation */
.fade-in {
    animation: fadeIn 0.8s ease-out forwards;
}

@keyframes fadeIn {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
}

/* Mobile */
@media (max-width: 768px) {
    .container {
        padding: 30px;
    }
}
 
    </style>
</head>
<body>

    <div class="container fade-in">
        <h2>Contact Us</h2>
        <form id="contactForm" action="/api/contact" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" name="name" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea name="message" id="message" placeholder="Write your message" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
        <div id="message" class="message"></div>
        <div id="thankYouMessage" class="thank-you-message" style="display: none;">
            Thank you for contacting us! We will get back to you shortly. Redirecting in: <span id="countdown">5</span> seconds.
        </div>
    </div>

     <script>
        const form = document.getElementById('contactForm');
        const messageDiv = document.getElementById('message');
        const thankYouMessageDiv = document.getElementById('thankYouMessage');
        const countdownElement = document.getElementById('countdown');
        const container = document.querySelector('.container');
        let countdown = 5;  // Start countdown at 5 seconds

        form.addEventListener('submit', function (e) {
            e.preventDefault();  // Prevent form default submission

            const formData = new FormData(form);  // Create FormData object with form data

            // Send form data to server
            fetch('/api/contact', {
                method: 'POST',
                body: formData  // Send FormData directly
            })
                .then(response => response.json())
                .then(data => {
                    // Display success or error message
                    if (data.status === 'success') {
                        messageDiv.innerHTML = `<p class="success">${data.message}</p>`;
                        form.style.display = 'none'; // Hide the form
                        thankYouMessageDiv.style.display = 'block'; // Show the thank you message
                          // Redirect to homepage or another URL
                        
                        // Countdown logic for redirect
                        const countdownInterval = setInterval(function() {
                            countdown--;
                            countdownElement.textContent = countdown;
                            if (countdown <= 0) {
                                clearInterval(countdownInterval);
                                window.location.href = '/api/contact';  // Redirect to homepage or another URL
                            }
                        }, 1000);  // Update every second
                    } else {
                        messageDiv.innerHTML = `<p class="error">${data.errors.join(', ')}</p>`;
                    }
                })
                .catch(err => {
                    messageDiv.innerHTML = `<p class="error">An error occurred. Please try again.</p>`;
                });
        });
    </script>
