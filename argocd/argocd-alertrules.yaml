# ArgoCD Alert Rules for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-monitoring-rules
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: argocd
      rules:
        # Alert on sync failures
        - alert: ArgoCDSyncFailure
          expr: increase(argocd_app_sync_total{result="failed"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: "ArgoCD application sync failures detected"
            description: "Application {{ $labels.name }} in namespace {{ $labels.namespace }} has failed to sync"
        
        # Alert on high sync duration
        - alert: ArgoCDSyncSlow
          expr: histogram_quantile(0.95, rate(argocd_app_reconcile_duration_seconds_bucket[5m])) > 60
          for: 5m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: "ArgoCD sync taking longer than 60s"
            description: "Application {{ $labels.name }} reconciliation is taking longer than 60s"
        
        # Alert on high API error rate
        - alert: ArgoCDHighErrorRate
          expr: rate(argocd_server_api_request_duration_seconds_count{code!~"2.."}[5m]) / rate(argocd_server_api_request_duration_seconds_count[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: "High API error rate in ArgoCD"
            description: "ArgoCD API error rate is above 5%"
        
        # Alert on controller downtime
        - alert: ArgoCDControllerDown
          expr: absent(up{job="argocd-controller-monitor"} == 1)
          for: 5m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: "ArgoCD Controller is down"
            description: "ArgoCD Application Controller metrics are not being scraped"
