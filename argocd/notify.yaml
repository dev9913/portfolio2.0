apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.email: |
    username: $email-username     
    password: $email-password      
    host: smtp.gmail.com            
    port: 465                        
    from: $email-username             
 # Templates
  template.email-outofsync: |
    email:
      subject: "[ArgoCD] {{.app.metadata.name}} is OUT OF SYNC ⚠️"
      body: |
        Application: {{.app.metadata.name}}
        Namespace: {{.app.metadata.namespace}}
        Sync Status: {{.app.status.sync.status}}
        Desired Revision: {{.app.status.sync.revision}}
        Health Status: {{.app.status.health.status}}
        Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.sync-failed: |
    email:
      subject: "[ArgoCD] Sync Failed: {{.app.metadata.name}}"
      body: |
        <h3>Sync Failed Notification</h3>
        <p><strong>Application:</strong> {{.app.metadata.name}}</p>
        <p><strong>Namespace:</strong> {{.app.metadata.namespace}}</p>
        <p><strong>Status:</strong> {{.app.status.sync.status}}</p>
        <p><strong>Message:</strong> {{.app.status.sync.message}}</p>
        <p><strong>Revision:</strong> {{.app.status.sync.revision}}</p>
        <p><a href="{{.context.argocdUrl}}/applications/{{.app.metadata.name}}">View in ArgoCD</a></p>

  template.sync-succeeded: |
    email:
      subject: "[ArgoCD] Sync Succeeded: {{.app.metadata.name}}"
      body: |
        <h3>Sync Succeeded Notification</h3>
        <p><strong>Application:</strong> {{.app.metadata.name}}</p>
        <p><strong>Namespace:</strong> {{.app.metadata.namespace}}</p>
        <p><strong>Successfully synced to revision:</strong> {{.app.status.sync.revision}}</p>
        <p><a href="{{.context.argocdUrl}}/applications/{{.app.metadata.name}}">View in ArgoCD</a></p>

  template.health-degraded: |
    email:
      subject: "[ArgoCD] Health Degraded: {{.app.metadata.name}}"
      body: |
        <h3>Health Degraded Notification</h3>
        <p><strong>Application:</strong> {{.app.metadata.name}}</p>
        <p><strong>Current Health:</strong> {{.app.status.health.status}}</p>
        <p><strong>Message:</strong> {{.app.status.health.message}}</p>
        <p><a href="{{.context.argocdUrl}}/applications/{{.app.metadata.name}}">View in ArgoCD</a></p>

  template.app-deleted: |
    email:
      subject: "[ArgoCD] Application Deleted: {{.app.metadata.name}}"
      body: |
        <h3>Application Deleted</h3>
        <p>The following ArgoCD application was deleted:</p>
        <p><strong>Name:</strong> {{.app.metadata.name}}</p>
        <p><strong>Namespace:</strong> {{.app.metadata.namespace}}</p>

  template.sync-started: |
    email:
      subject: "[ArgoCD] Sync Started: {{.app.metadata.name}}"
      body: |
        <h3>Sync Started Notification</h3>
        <p><strong>Application:</strong> {{.app.metadata.name}}</p>
        <p><strong>Namespace:</strong> {{.app.metadata.namespace}}</p>
        <p><strong>Revision:</strong> {{.app.status.sync.revision}}</p>
        <p><a href="{{.context.argocdUrl}}/applications/{{.app.metadata.name}}">View in ArgoCD</a></p>

  # Triggers
  trigger.on-outofsync: |
    - when: app.status.sync.status == 'OutOfSync'
      send: [email-outofsync]

  trigger.on-sync-failed: |
    - when: app.status.sync.status == 'Failed'
      send: [sync-failed]

  trigger.on-sync-succeeded: |
    - when: app.status.sync.status == 'Succeeded'
      send: [sync-succeeded]

  trigger.on-sync-started: |
    - when: app.status.sync.status == 'Running'
      send: [sync-started]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [health-degraded]

  trigger.on-health-healthy: |
    - when: app.status.health.status == 'Healthy'
      send: [sync-succeeded]

  trigger.on-app-deleted: |
    - when: app.metadata.deletionTimestamp != nil
      send: [app-deleted]
