apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:

  context: |
    argocdUrl: "http://<your-argocd-url>:8080"

  service.email: |
    host: smtp.gmail.com
    port: 587
    username: $email-username
    password: $email-password
    from: $email-username

  subscriptions: |
    - recipients:
        - email: yourgmail@gmail.com
      triggers:
        - on-deployed
        - on-health-degraded
        - on-outofsync

  template.email-deployed: |
    email:
      subject: "[ArgoCD] {{.app.metadata.name}} successfully deployed 🎉"
    message: |
      ✅ Application: {{.app.metadata.name}}
      Namespace: {{.app.metadata.namespace}}
      Sync status: {{.app.status.sync.status}}
      Revision: {{.app.status.sync.revision}}
      Health status: {{.app.status.health.status}}
      Finished at: {{ if .app.operationState }}{{ .app.operationState.finishedAt }}{{ end }}
      Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.email-health-degraded: |
    email:
      subject: "[ArgoCD] {{.app.metadata.name}} health is {{.app.status.health.status}} 🚨"
    message: |
      🚨 Application: {{.app.metadata.name}}
      Namespace: {{.app.metadata.namespace}}
      Sync status: {{.app.status.sync.status}}
      Health status: {{.app.status.health.status}}
      Health message: {{.app.status.health.message}}
      Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.email-outofsync: |
    email:
      subject: "[ArgoCD] {{.app.metadata.name}} is OUT OF SYNC ⚠️"
    message: |
      ⚠️ Application: {{.app.metadata.name}}
      Namespace: {{.app.metadata.namespace}}
      Sync status: {{.app.status.sync.status}}
      Desired Revision: {{.app.status.sync.revision}}
      Health status: {{.app.status.health.status}}
      Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  trigger.on-deployed: |
    - when: app.status.operationState.phase == 'Succeeded' and app.status.health.status == 'Healthy'
      send: [email-deployed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [email-health-degraded]

  trigger.on-outofsync: |
    - when: app.status.sync.status == 'OutOfSync'
      send: [email-outofsync]
