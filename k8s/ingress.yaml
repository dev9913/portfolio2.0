apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: portfolio
spec:
  ingressClassName: traefik
  rules:
  - host:  'devopscloud.me'
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend-svc
            port: 
              number: 80
      - pathType: Prefix
        path: "/contact"
        backend:
          service:
            name: backend-svc
            port: 
              number: 5000
      - pathType: Prefix
        path: "/admin.php"
        backend:
          service:
            name: admin-svc
            port: 
              number: 80        
