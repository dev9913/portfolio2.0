kind: Deployment 
apiVersion: apps/v1
metadata:
  name: frontend
  namespace: portfolio
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.email: "devjangig@gmail.com"  
    notifications.argoproj.io/subscribe.on-deployed.email: "devjangig@gmail.com" 

spec:
  replicas: 1
  selector:
    matchLabels:
      app: "frontend"
  template:
    metadata:
      labels:
        app: "frontend"
    spec:
      containers:
      - name: frontend
        image: dev7878/portfolio-frontend:1.0
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: 200m 
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10  
        
