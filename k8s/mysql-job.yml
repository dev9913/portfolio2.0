apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-sql
  namespace: portfolio
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS __MYSQL_DATABASE__;

    CREATE USER IF NOT EXISTS '__MYSQL_USER__'@'%' IDENTIFIED BY '__MYSQL_USER_PASSWORD__';
    GRANT ALL PRIVILEGES ON __MYSQL_DATABASE__.* TO '__MYSQL_USER__'@'%';
    FLUSH PRIVILEGES;

    USE __MYSQL_DATABASE__;

    CREATE TABLE IF NOT EXISTS messages (
      id INT AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      email VARCHAR(255) NOT NULL,
      message TEXT NOT NULL,
      created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
      replied_message TEXT NULL,
      date DATE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8;

---

apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init-job
  namespace: portfolio
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 3
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "k8s-role"
        vault.hashicorp.com/agent-inject-secret-env: "secret/data/creds"
        vault.hashicorp.com/agent-inject-template-env: |
          {{- with secret "secret/data/creds" -}}
          export DB_PASSWORD="{{ .Data.data.password }}"
          export DB_USER="{{ .Data.data.user }}"
          export ROOT_PASSWORD="{{ .Data.data.root_password }}"
          {{- end }}
    spec:
      serviceAccountName: vault-admin
      restartPolicy: OnFailure
      containers:
        - name: mysql-init
          image: mysql:5.7
          volumeMounts:
            - name: init-sql
              mountPath: /sql
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_NAME
          command:
            - sh
            - -c
            - |
              # Load Vault secrets
              source /vault/secrets/env

              echo "Waiting for MySQL at $DB_HOST..."

              timeout=60
              while ! mysql -h "$DB_HOST" -uroot -p"$ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; do
                sleep 2
                timeout=$((timeout-2))
                if [ $timeout -le 0 ]; then
                  echo "MySQL not reachable. Exiting."
                  exit 1
                fi
              done

              echo "Injecting secrets into SQL template..."
              sed \
                -e "s/__MYSQL_DATABASE__/$DB_NAME/g" \
                -e "s/__MYSQL_USER__/$DB_USER/g" \
                -e "s/__MYSQL_USER_PASSWORD__/$DB_PASSWORD/g" \
                /sql/init.sql > /tmp/init.sql

              echo "Running init.sql..."
              mysql -h "$DB_HOST" -uroot -p"$ROOT_PASSWORD" < /tmp/init.sql

      volumes:
        - name: init-sql
          configMap:
            name: mysql-init-sql
