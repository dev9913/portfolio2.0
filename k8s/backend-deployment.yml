kind: Deployment
apiVersion: apps/v1
metadata:
  name: backend
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: dev7878/portfolio-backend:3.0.0
          imagePullPolicy: Always
          env:
            - name: DB_HOST # HOST 
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_HOST
            - name: DB_NAME # DB NAME
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_NAME
            - name: DB_USER # DB USER 
              valueFrom:
                secretKeyRef:
                  name: portfolio-secret
                  key: DB_USER
            - name: DB_PASSWORD # DB USER PASS
              valueFrom:
                secretKeyRef:
                  name: portfolio-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /contact
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /contact
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
