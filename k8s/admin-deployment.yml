kind: Deployment
apiVersion: apps/v1
metadata:
  name: admin
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "k8s-role"
        vault.hashicorp.com/agent-inject-secret-env: "secret/data/creds"
        vault.hashicorp.com/agent-inject-template-env: |
          {{- with secret "secret/data/creds" -}}
          DB_PASSWORD="{{ .Data.data.password }}"
          DB_USER="{{ .Data.data.user }}"
          MYSQL_ROOT_PASSWORD="{{ .Data.data.root_password }}"
          {{- end }}
    spec:
      serviceAccountName: vault-admin
      containers:
        - name: admin
          image: dev7878/portfolio-admin:1.0.0
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              echo "Loading Vault secrets..."
              set -a
              . /vault/secrets/env
              set +a
              printenv | grep DB_
              exec apache2-foreground
          envFrom:
            - configMapRef:
                name: db-config
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /admin.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /admin.php
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
