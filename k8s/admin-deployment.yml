kind: Deployment 
apiVersion: apps/v1
metadata:
  name: admin
  namespace: portfolio

spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
      - name: admin 
        image: dev7878/portfolio-admin:1.0
        envFrom:
          - configMapRef:
              name: db-config
          - secretRef:
              name: portfolio-secret
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: 200m 
            memory: 256Mi
          
          
